name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp27a
        with:
          pdk: ihp-sg13cmos5l

      - name: Print OpenLane and Flow Logs on Failure
        if: failure()
        run: |
          echo "=================================================="
          echo ">>> PRINTING FAILURE LOGS & SUMMARY <<<"
          echo "=================================================="
          find . -name "*.log" -o -name "openlane.log" -o -name "*.rpt" | while read -r f; do
            echo "--------------------------------------------------"
            echo "LOG FILE: $f"
            echo "--------------------------------------------------"
            tail -n 100 "$f"
          done


  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp27a

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp27a
        continue-on-error: true
