name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Run complete diagnostic and capture logs
        run: |
          pip install -r https://raw.githubusercontent.com/TinyTapeout/tt-support-tools/main/requirements.txt
          git clone https://github.com/TinyTapeout/tt-support-tools.git tt
          python ./tt/tt_tool.py --create-user-config --pdk ihp-sg13cmos5l 2>&1 | tee diag_create_config.txt || true
          cat diag_create_config.txt

      - name: Upload diag output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-output
          path: diag_create_config.txt

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp27a
        with:
          pdk: ihp-sg13cmos5l

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp27a

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp27a
        continue-on-error: true
